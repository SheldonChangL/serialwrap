[package]
name = "serialwrapd"
description = "Daemon core: port I/O, recorder, query layer, and write gate."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wrap-proto = { path = "../wrap-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
# Base64 for `data_b64` payload encoding (T1.2 recorder).
base64 = "0.22"
# `clock_gettime(CLOCK_MONOTONIC)` for `t_mono` — `std::time::Instant` is
# opaque and can't be serialized to an absolute seconds value (T1.2).
libc = "0.2"
# RFC 3339 wall-clock timestamps with a numeric UTC offset (T1.2 `t_wall`).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Platform data-dir resolution (`~/.local/share/serialwrap`, `~/Library/
# Application Support/serialwrap`) — recorder callers use this by default;
# tests always inject an explicit tempdir instead (T1.2).
directories = "5"
# Device enumeration (vid/pid/serial_number, per-platform port paths) for
# hotplug detection (T1.1). See the workspace `[workspace.dependencies]`
# entry for why `default-features` is disabled.
serialport = { workspace = true }
# `poll()` for the per-device reader thread's stop-flag-checking loop
# (T1.1, same pattern mock-device's own responder thread already uses) plus
# `socket` for `getsockopt` peer-credential lookups (T1.4: Linux
# `SO_PEERCRED` via `sockopt::PeerCredentials`, macOS `LOCAL_PEERPID` via
# `sockopt::LocalPeerPid` — see `protocol::peer_cred`).
nix = { workspace = true, features = ["socket"] }
# The async UDS server itself (T1.4): `UnixListener`/`UnixStream`, framed
# line I/O, per-device `Notify`/`Mutex`, `wait_for`'s `tokio::time::timeout`.
tokio = { workspace = true }
# `wait_for` regex matching against fully-assembled lines only (T1.4).
regex = { workspace = true }

[dev-dependencies]
# Test-only PTY fixture (see TASKS.md T0.2). Pulled in as a dev-dependency
# only, so it never links into the `serialwrap` release binary.
mock-device = { path = "../mock-device" }
# Test-only tempdirs (recorder tests must never touch the user's real data
# dir) and a hash for the byte-exact acceptance test (T1.2).
tempfile = "3"
sha2 = "0.10"
# `term` on top of this crate's own `[dependencies]` nix (adds
# `openpty`/`termios`, unified by cargo for test builds): T2.1's write-path
# tests build their own raw PTY pair directly (mirroring
# `mock_device::pty`'s private internals, which aren't reachable from
# outside that crate) so a test can read the master side directly and
# prove byte-exactness per line ending — something `mock-device`'s own
# line-based command-responder API can't distinguish (it strips the exact
# CR/LF bytes a byte-exact assertion needs to see).
nix = { workspace = true, features = ["term"] }
