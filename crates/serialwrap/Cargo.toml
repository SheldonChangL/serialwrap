[package]
name = "serialwrap"
description = "serialwrap: the single binary providing the daemon, the MCP bridge, and the CLI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serialwrapd = { path = "../serialwrapd" }
wrap-proto = { path = "../wrap-proto" }
clap = { workspace = true }
# `signal` on top of the workspace's base feature set: `tail -f`'s Ctrl-C
# handling (T1.5) uses `tokio::signal::ctrl_c()`. `io-std` adds async
# `tokio::io::{stdin, stdout}` (T3.1's MCP bridge is a stdio server —
# `rpc.rs` reads requests from stdin and writes replies to stdout). `process`
# is `serialwrap run`'s own child-process spawning (T2.2, issue #9) — the
# external tool a lease is acquired for.
tokio = { workspace = true, features = ["signal", "io-std", "process"] }
serde_json = { workspace = true }
# RFC 3339 parsing/formatting for `tail`'s default timestamp display and
# `--since` (T1.5) — the client-side read counterpart to the same crate's
# `t_wall` encoding `serialwrapd` already relies on (T1.2).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Decode a line's `raw_b64` field (issue #32) back into the exact original
# device bytes for byte-exact hex-preview rendering (`cli::render`) — same
# version `serialwrapd` itself uses to encode it.
base64 = "0.22"

[dev-dependencies]
# Test-only PTY fixture (see TASKS.md T0.2), used by this crate's own
# `devices`/`tail` integration tests (T1.5) the same way `serialwrapd`'s
# tests use it — dev-dependency only, never linked into the release binary.
mock-device = { path = "../mock-device" }
tempfile = "3"
# Byte-exactness assertions for `export`'s `bin` format acceptance tests
# (`TASKS.md` T2.4) — same version `serialwrapd` itself uses.
sha2 = "0.10"
# Send a real SIGINT to a spawned `serialwrap tail -f` child process, to
# test the Ctrl-C acceptance criterion (T1.5) against the actual compiled
# binary rather than an in-process approximation. `term` adds
# `openpty`/termios, used by T2.1's own CLI-level write tests to build a
# raw PTY pair directly (same reasoning as `serialwrapd`'s own
# `[dev-dependencies]` comment on why: byte-exact per-line-ending
# assertions need the PTY master read directly, which `mock-device`'s
# line-based command-responder API can't give a test).
nix = { workspace = true, features = ["signal", "term"] }
# Spawning the compiled `serialwrap` binary as a child process from
# integration tests (T1.5) needs tokio's `process` feature — now also part
# of the main `[dependencies]` tokio entry above (`serialwrap run`, T2.2,
# spawns a child in production too), so nothing extra is needed here beyond
# what's already pulled in.
