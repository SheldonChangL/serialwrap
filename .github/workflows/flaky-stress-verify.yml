name: Flaky test stress verification (temporary, issue #39)

# TEMPORARY workflow for verifying the timing-stability fixes in issue #39 on
# Linux, where the original flakes reproduced (never on macOS). Triggered by
# pushes to this fix branch only (workflow_dispatch requires the workflow
# file to already exist on the default branch, which this deliberately does
# not, to avoid touching main); removed again once verification is done —
# not part of the permanent CI setup.

on:
  push:
    branches: [fix-test-timing-stability]

jobs:
  stress:
    name: repeat cargo test --all on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build test binaries once
        run: cargo test --all --no-run

      - name: Repeat cargo test --all N times, fail fast on the first failure
        run: |
          set -u
          N=200
          echo "Running cargo test --all x ${N} on $(uname -a)"
          for i in $(seq 1 "$N"); do
            if ! out=$(cargo test --all 2>&1); then
              echo "=== FAILURE on iteration ${i}/${N} ==="
              echo "$out"
              exit 1
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "iteration ${i}/${N} ok"
            fi
          done
          echo "ALL ${N} ITERATIONS PASSED"
